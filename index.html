<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lima Weather — Animated</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
    background: #070e14;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 16px;
  }
  .card {
    border-radius: 22px; overflow: hidden; width: 100%; max-width: 1400px;
    box-shadow:
      0 16px 60px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.06),
      0 0 120px rgba(100,180,220,0.08);
    position: relative;
    aspect-ratio: 16/9;
  }

  /* ═══════════════════════════════════════ */
  /* ═══ KEYFRAMES                      ═══ */
  /* ═══════════════════════════════════════ */

  /* Scene entrance */
  @keyframes sceneIn{0%{opacity:0}100%{opacity:1}}
  @keyframes sunRise{0%{transform:translateY(60px);opacity:0}100%{transform:translateY(0);opacity:1}}

  /* Clouds */
  @keyframes drift1{0%{transform:translateX(0)}100%{transform:translateX(-960px)}}
  @keyframes drift2{0%{transform:translateX(300px)}100%{transform:translateX(-960px)}}
  @keyframes drift3{0%{transform:translateX(600px)}100%{transform:translateX(-960px)}}
  @keyframes cloudgrow{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  /* Sun */
  @keyframes sunpulse{0%,100%{r:54;opacity:0.92}50%{r:58;opacity:1}}
  @keyframes sunray{0%,100%{opacity:0;transform:scale(0.8)}50%{opacity:0.22;transform:scale(1.35)}}
  @keyframes glow{0%,100%{opacity:0.15}50%{opacity:0.38}}

  /* Wind */
  @keyframes windline1{0%{stroke-dashoffset:140;opacity:0}30%{opacity:0.75}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes windline2{0%{stroke-dashoffset:100;opacity:0}30%{opacity:0.6}100%{stroke-dashoffset:0;opacity:0}}

  /* Windows */
  @keyframes blink{0%,100%{opacity:0.8}50%{opacity:0.15}}

  /* UI panels */
  @keyframes popupin{0%{opacity:0;transform:translateY(22px) scale(0.93)}70%{transform:translateY(-4px) scale(1.02)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes floatin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  @keyframes iconPop{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes slideInRight{0%{transform:translateX(30px);opacity:0}100%{transform:translateX(0);opacity:1}}

  /* Birds */
  @keyframes birdflight{0%{transform:translate(0,0);opacity:1}25%{transform:translate(220px,-22px)}50%{transform:translate(440px,10px)}75%{transform:translate(660px,-14px)}100%{transform:translate(1000px,6px);opacity:1}}
  @keyframes birdflight2{0%{transform:translate(0,0);opacity:1}30%{transform:translate(200px,14px)}60%{transform:translate(480px,-10px)}100%{transform:translate(1000px,8px);opacity:1}}
  @keyframes birdwing{0%,100%{d:path("M0 4 Q4 0 8 4 Q12 0 16 4")}50%{d:path("M0 2 Q4 6 8 2 Q12 6 16 2")}}

  /* Plane */
  @keyframes planeflight{0%{transform:translate(-80px,200px)}100%{transform:translate(1060px,70px)}}
  @keyframes exhaustpuff{0%{opacity:0.6;transform:translateX(0)}100%{opacity:0;transform:translateX(-30px)}}

  /* Water */
  @keyframes shimmer{0%,100%{opacity:0.55}50%{opacity:0.85}}
  @keyframes wavemove{0%{transform:translateX(0)}100%{transform:translateX(-120px)}}
  @keyframes ripple{0%{r:0;opacity:0.4}100%{r:18;opacity:0}}
  @keyframes waveSplash{0%,100%{opacity:0;transform:scale(0.6)}50%{opacity:0.5;transform:scale(1)}}

  /* Rain */
  @keyframes raindrop{0%{transform:translateY(-10px);opacity:0}20%{opacity:0.7}100%{transform:translateY(80px);opacity:0}}
  @keyframes fadeup{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}

  /* Stars */
  @keyframes twinkle{0%,100%{opacity:0.15}50%{opacity:0.8}}
  @keyframes twinkle2{0%,100%{opacity:0.5}50%{opacity:0.1}}

  /* Shooting star */
  @keyframes shootingstar{0%{transform:translate(0,0) rotate(-25deg);opacity:0}8%{opacity:1}100%{transform:translate(320px,140px) rotate(-25deg);opacity:0}}

  /* Fog */
  @keyframes fogdrift{0%{transform:translateX(-200px);opacity:0}20%{opacity:0.16}80%{opacity:0.16}100%{transform:translateX(1100px);opacity:0}}
  @keyframes fogdrift2{0%{transform:translateX(-300px);opacity:0}20%{opacity:0.1}80%{opacity:0.1}100%{transform:translateX(1100px);opacity:0}}

  /* Boat */
  @keyframes boatBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes boatSail{0%{transform:translateX(-60px)}100%{transform:translateX(400px)}}

  /* Lighthouse */
  @keyframes lighthouse{0%,46%{opacity:0}48%{opacity:0.55}52%{opacity:0.55}54%,100%{opacity:0}}
  @keyframes lighthouseSweep{0%{transform:rotate(-18deg)}100%{transform:rotate(18deg)}}

  /* Icons */
  @keyframes thermoPulse{0%,100%{fill:#ff6b6b}50%{fill:#ff9a9a}}
  @keyframes dropletWobble{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.1)}}
  @keyframes uvPulse{0%,100%{opacity:0.6}50%{opacity:1}}
  @keyframes gentleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  @keyframes barGrow{0%{width:0}100%{width:103px}}

  /* Title */
  @keyframes titleReveal{0%{opacity:0;transform:translateY(18px) scale(0.96);letter-spacing:8px}100%{opacity:1;transform:translateY(0) scale(1);letter-spacing:2px}}
  @keyframes subtitleReveal{0%{opacity:0;transform:translateY(10px)}100%{opacity:0.7;transform:translateY(0)}}

  /* Farewell */
  @keyframes farewellIn{0%{opacity:0;transform:scale(0.9)}60%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
  @keyframes farewellGlow{0%,100%{opacity:0.4}50%{opacity:0.8}}

  /* Humidity trend arrow */
  @keyframes arrowBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
</head>
<body>

<div class="card">
<svg width="100%" height="100%" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="display:block;">
  <defs>
    <clipPath id="sc"><rect width="960" height="310"/></clipPath>
    <clipPath id="wc"><rect x="0" y="360" width="960" height="180"/></clipPath>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87c4e8">
        <animate attributeName="stop-color" values="#87c4e8;#a0b8e8;#87c4e8" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#a8d4ee">
        <animate attributeName="stop-color" values="#a8d4ee;#c4b8f0;#a8eed4;#a8d4ee" dur="22s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#c5e8f6"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#faea8a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#f7d460" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f7d460" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d6b7a"/>
      <stop offset="100%" stop-color="#1e3e4e"/>
    </linearGradient>
    <filter id="iconGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SCENE BUILD-UP (0-4s)                              -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- Sky -->
  <rect width="960" height="540" fill="url(#skyGrad)" style="animation:sceneIn 2s ease-out both"/>

  <!-- Stars (subtle) -->
  <g style="animation:sceneIn 3s ease-out both">
    <circle cx="120" cy="28" r="1.2" fill="white" style="animation:twinkle 3s ease-in-out infinite"/>
    <circle cx="260" cy="18" r="1" fill="white" style="animation:twinkle 4s ease-in-out infinite 1s"/>
    <circle cx="410" cy="32" r="0.8" fill="white" style="animation:twinkle2 3.5s ease-in-out infinite 0.5s"/>
    <circle cx="530" cy="12" r="1.1" fill="white" style="animation:twinkle 5s ease-in-out infinite 2s"/>
    <circle cx="680" cy="24" r="0.9" fill="white" style="animation:twinkle2 3.8s ease-in-out infinite 1.5s"/>
    <circle cx="820" cy="38" r="1" fill="white" style="animation:twinkle 4.5s ease-in-out infinite 0.8s"/>
    <circle cx="45" cy="42" r="0.7" fill="white" style="animation:twinkle2 3.2s ease-in-out infinite 2.2s"/>
    <circle cx="740" cy="14" r="1.3" fill="white" style="animation:twinkle 6s ease-in-out infinite 3s"/>
    <circle cx="900" cy="20" r="0.8" fill="white" style="animation:twinkle2 4.2s ease-in-out infinite 1.8s"/>
  </g>

  <!-- Sun (rises in 0-3s) -->
  <g style="animation:sunRise 3s ease-out both">
    <circle cx="760" cy="88" r="100" fill="url(#sunGlow)" style="animation:glow 3s ease-in-out infinite"/>
    <circle cx="760" cy="88" r="54" fill="#f7d460" style="animation:sunpulse 4s ease-in-out infinite"/>
    <circle cx="760" cy="88" r="40" fill="#faea8a"/>
    <!-- Sun face -->
    <circle cx="750" cy="83" r="3" fill="#e8c030" opacity="0.45"/>
    <circle cx="770" cy="83" r="3" fill="#e8c030" opacity="0.45"/>
    <path d="M748 96 Q760 103 772 96" fill="none" stroke="#e8c030" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <!-- Sun rays -->
    <g style="transform-origin:760px 88px;animation:sunray 4s ease-in-out infinite">
      <line x1="760" y1="18" x2="760" y2="32" stroke="#f7d460" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="760" y1="144" x2="760" y2="158" stroke="#f7d460" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="690" y1="88" x2="704" y2="88" stroke="#f7d460" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="816" y1="88" x2="830" y2="88" stroke="#f7d460" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="710" y1="38" x2="720" y2="48" stroke="#f7d460" stroke-width="2" stroke-linecap="round"/>
      <line x1="800" y1="128" x2="810" y2="138" stroke="#f7d460" stroke-width="2" stroke-linecap="round"/>
      <line x1="810" y1="38" x2="800" y2="48" stroke="#f7d460" stroke-width="2" stroke-linecap="round"/>
      <line x1="720" y1="128" x2="710" y2="138" stroke="#f7d460" stroke-width="2" stroke-linecap="round"/>
      <line x1="726" y1="56" x2="732" y2="63" stroke="#f7d460" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="794" y1="56" x2="788" y2="63" stroke="#f7d460" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="726" y1="120" x2="732" y2="113" stroke="#f7d460" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="794" y1="120" x2="788" y2="113" stroke="#f7d460" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Clouds -->
  <g clip-path="url(#sc)" style="animation:sceneIn 2.5s ease-out both">
    <g style="animation:drift1 24s linear infinite">
      <g style="animation:cloudgrow 6s ease-in-out infinite">
        <ellipse cx="130" cy="70" rx="85" ry="28" fill="white" opacity="0.76"/>
        <ellipse cx="180" cy="58" rx="62" ry="24" fill="white" opacity="0.64"/>
        <ellipse cx="88" cy="78" rx="50" ry="20" fill="white" opacity="0.58"/>
      </g>
      <ellipse cx="1020" cy="90" rx="70" ry="24" fill="white" opacity="0.52"/>
      <ellipse cx="1065" cy="78" rx="48" ry="18" fill="white" opacity="0.44"/>
    </g>
    <g style="animation:drift2 30s linear infinite">
      <g style="animation:cloudgrow 8s ease-in-out infinite 2s">
        <ellipse cx="420" cy="52" rx="68" ry="22" fill="white" opacity="0.54"/>
        <ellipse cx="470" cy="42" rx="48" ry="17" fill="white" opacity="0.46"/>
      </g>
      <ellipse cx="1120" cy="64" rx="80" ry="26" fill="white" opacity="0.52"/>
    </g>
    <g style="animation:drift3 38s linear infinite">
      <ellipse cx="640" cy="76" rx="56" ry="19" fill="white" opacity="0.42"/>
      <ellipse cx="1360" cy="52" rx="64" ry="20" fill="white" opacity="0.38"/>
    </g>
  </g>

  <!-- Wind lines (continuous) -->
  <g style="animation:sceneIn 3s ease-out both">
    <line x1="40" y1="130" x2="190" y2="130" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="150 150" style="animation:windline1 2.4s ease-in-out infinite"/>
    <line x1="20" y1="150" x2="140" y2="150" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="120 120" style="animation:windline1 2.4s ease-in-out infinite 0.5s"/>
    <line x1="50" y1="170" x2="186" y2="170" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="136 136" style="animation:windline2 2.4s ease-in-out infinite 0.9s"/>
    <line x1="66" y1="190" x2="170" y2="190" stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="104 104" style="animation:windline2 2.4s ease-in-out infinite 1.3s"/>
    <line x1="30" y1="208" x2="120" y2="208" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="90 90" style="animation:windline1 2.8s ease-in-out infinite 1.8s"/>
  </g>

  <!-- Skyline + water (builds in 1-3s) -->
  <g style="animation:sceneIn 2s ease-out both;animation-delay:0.5s">
    <rect x="0" y="310" width="960" height="230" fill="url(#waterGrad)"/>
    <rect x="0" y="390" width="960" height="150" fill="#1e3e4e"/>

    <!-- Buildings -->
    <rect x="20" y="254" width="50" height="100" fill="#2e5a6a" rx="2"/>
    <rect x="74" y="236" width="38" height="118" fill="#254e5e" rx="2"/>
    <rect x="116" y="268" width="60" height="86" fill="#2e5a6a" rx="2"/>
    <rect x="182" y="224" width="42" height="130" fill="#254e5e" rx="2"/>
    <rect x="230" y="260" width="54" height="94" fill="#2e5a6a" rx="2"/>
    <rect x="290" y="242" width="36" height="112" fill="#254e5e" rx="2"/>
    <rect x="332" y="272" width="64" height="82" fill="#2e5a6a" rx="2"/>
    <rect x="402" y="232" width="40" height="122" fill="#254e5e" rx="2"/>
    <rect x="448" y="258" width="58" height="96" fill="#2e5a6a" rx="2"/>
    <rect x="512" y="248" width="36" height="106" fill="#254e5e" rx="2"/>
    <rect x="554" y="266" width="52" height="88" fill="#2e5a6a" rx="2"/>
    <rect x="612" y="226" width="44" height="128" fill="#254e5e" rx="2"/>
    <rect x="662" y="252" width="60" height="102" fill="#2e5a6a" rx="2"/>
    <rect x="728" y="240" width="38" height="114" fill="#254e5e" rx="2"/>
    <rect x="772" y="264" width="50" height="90" fill="#2e5a6a" rx="2"/>
    <rect x="828" y="248" width="42" height="106" fill="#254e5e" rx="2"/>
    <rect x="876" y="270" width="64" height="84" fill="#2e5a6a" rx="2"/>

    <!-- Antenna -->
    <line x1="203" y1="224" x2="203" y2="208" stroke="#3a7a8a" stroke-width="1.5"/>
    <circle cx="203" cy="206" r="2" fill="#ff4444" style="animation:blink 1.5s ease-in-out infinite"/>

    <!-- Windows -->
    <rect x="32" y="268" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3.1s ease-in-out infinite"/>
    <rect x="48" y="268" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3.1s ease-in-out infinite 0.7s"/>
    <rect x="32" y="284" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3.1s ease-in-out infinite 1.4s"/>
    <rect x="48" y="284" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 4s ease-in-out infinite 2.1s"/>
    <rect x="82" y="248" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 4s ease-in-out infinite 0.3s"/>
    <rect x="82" y="264" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 4s ease-in-out infinite 1.1s"/>
    <rect x="82" y="280" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 3.5s ease-in-out infinite 1.9s"/>
    <rect x="190" y="238" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 2.8s ease-in-out infinite 0.5s"/>
    <rect x="190" y="256" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 2.8s ease-in-out infinite 1.2s"/>
    <rect x="190" y="274" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3.2s ease-in-out infinite 2s"/>
    <rect x="410" y="246" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 3.6s ease-in-out infinite 0.4s"/>
    <rect x="410" y="262" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 3.6s ease-in-out infinite 1.6s"/>
    <rect x="620" y="240" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3.5s ease-in-out infinite 0.9s"/>
    <rect x="620" y="258" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3.5s ease-in-out infinite 1.8s"/>
    <rect x="620" y="276" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 2.6s ease-in-out infinite 0.6s"/>
    <rect x="736" y="254" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 3.3s ease-in-out infinite 0.2s"/>
    <rect x="736" y="270" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 3.3s ease-in-out infinite 1.4s"/>
    <rect x="836" y="262" width="8" height="6" fill="#f0e070" rx="1" style="animation:blink 4.2s ease-in-out infinite 0.8s"/>
    <rect x="890" y="284" width="9" height="7" fill="#f0e070" rx="1" style="animation:blink 3s ease-in-out infinite 1s"/>
  </g>

  <!-- Lighthouse -->
  <g transform="translate(910,270)" style="animation:sceneIn 2s ease-out both;animation-delay:1s">
    <rect x="-6" y="0" width="12" height="42" fill="#4a2020" rx="1"/>
    <rect x="-9" y="-4" width="18" height="8" fill="#5a3030" rx="2"/>
    <rect x="-4" y="-6" width="8" height="4" fill="#ffeebb" rx="1" opacity="0.9"/>
    <g style="transform-origin:0px -4px;animation:lighthouseSweep 4s ease-in-out infinite alternate">
      <polygon points="0,-4 -60,30 60,30" fill="#ffeebb" opacity="0" style="animation:lighthouse 4s linear infinite"/>
    </g>
  </g>

  <!-- Water shimmer (continuous) -->
  <g clip-path="url(#wc)" style="animation:wavemove 3s linear infinite">
    <ellipse cx="100" cy="430" rx="70" ry="5" fill="#5aaac8" opacity="0.25" style="animation:shimmer 2s ease-in-out infinite"/>
    <ellipse cx="300" cy="440" rx="90" ry="5" fill="#5aaac8" opacity="0.2" style="animation:shimmer 2s ease-in-out infinite 0.5s"/>
    <ellipse cx="520" cy="425" rx="80" ry="5" fill="#5aaac8" opacity="0.22" style="animation:shimmer 2s ease-in-out infinite 1s"/>
    <ellipse cx="740" cy="435" rx="65" ry="5" fill="#5aaac8" opacity="0.18" style="animation:shimmer 2s ease-in-out infinite 1.5s"/>
    <ellipse cx="920" cy="430" rx="75" ry="5" fill="#5aaac8" opacity="0.2"/>
    <ellipse cx="180" cy="450" rx="55" ry="4" fill="#5aaac8" opacity="0.15" style="animation:shimmer 2.5s ease-in-out infinite 0.8s"/>
    <ellipse cx="620" cy="455" rx="60" ry="4" fill="#5aaac8" opacity="0.14" style="animation:shimmer 2.5s ease-in-out infinite 1.2s"/>
  </g>
  <!-- Water ripples -->
  <circle cx="200" cy="420" r="0" fill="none" stroke="#7bbdd4" stroke-width="0.8" style="animation:ripple 3s ease-out infinite"/>
  <circle cx="500" cy="430" r="0" fill="none" stroke="#7bbdd4" stroke-width="0.8" style="animation:ripple 3s ease-out infinite 1s"/>
  <circle cx="780" cy="418" r="0" fill="none" stroke="#7bbdd4" stroke-width="0.8" style="animation:ripple 3s ease-out infinite 2s"/>
  <!-- Splash particles -->
  <circle cx="350" cy="395" r="2" fill="white" opacity="0" style="animation:waveSplash 4s ease-in-out infinite"/>
  <circle cx="650" cy="398" r="1.8" fill="white" opacity="0" style="animation:waveSplash 5s ease-in-out infinite 1.5s"/>

  <!-- Fog (throughout) -->
  <ellipse cx="0" cy="290" rx="400" ry="14" fill="white" opacity="0" style="animation:fogdrift 32s ease-in-out infinite;animation-delay:8s"/>
  <ellipse cx="0" cy="305" rx="500" ry="10" fill="white" opacity="0" style="animation:fogdrift2 42s ease-in-out infinite;animation-delay:15s"/>


  <!-- ═══════════════════════════════════════════════════ -->
  <!-- 0-5s  "Buenos días y bienvenidos..."               -->
  <!--        WELCOME TITLE                               -->
