
<style>

  @keyframes drift2{0%{transform:translateX(300px)}100%{transform:translateX(-880px)}}

  @keyframes sunpulse{0%,100%{r:50;opacity:0.92}50%{r:54;opacity:1}}
  @keyframes sunray{0%,100%{opacity:0;transform:scale(0.8)}50%{opacity:0.18;transform:scale(1.3)}}
  @keyframes windline1{0%{stroke-dashoffset:140;opacity:0}30%{opacity:0.75}100%{stroke-dashoffset:0;opacity:0}}
  @keyframes windline2{0%{stroke-dashoffset:100;opacity:0}30%{opacity:0.6}100%{stroke-dashoffset:0;opacity:0}}

  @keyframes planeflight{0%{transform:translate(-60px,180px)}100%{transform:translate(760px,80px)}}

  @keyframes cloudgrow{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  @keyframes horizon{0%{opacity:0}100%{opacity:1}}
</style>
